name: juno_kite_trusted_principal
label: Juno--Kite trusted principal
kind: standalone
version: "0.2.0"
description: >
  Host-bound, principal-scoped Juno-to-Kite consultation using standard A2A,
  session ContextVars, exact-argument policy hooks, and signed minimized output.
author: Nous Research
provides_tools:
  - consult_kite
  - kite_gmail_search
  - kite_gmail_get
  - kite_gmail_attachment_extract
  - kite_calendar_read
  - kite_things_read
  - kite_property_read
  - kite_whatsapp_archive_read
  - kite_personal_files_read
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - pre_tool_dispatch
  - transform_llm_output
